plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

//compileJava.options.encoding = 'UTF-8'
//
//tasks.withType(JavaCompile) {
//    options.encoding = 'UTF-8'
//}

//org.gradle.jvmargs='-Dfile.encoding=UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'com.opencsv:opencsv:5.7.1'
    implementation("com.vk.api:sdk:1.0.16")
    implementation("org.apache.httpcomponents:httpclient:4.5.14")
    implementation("org.slf4j:slf4j-api:1.7.26")
    implementation("org.apache.commons:commons-lang3:3.17.0")
    implementation("org.apache.logging.log4j:log4j-slf4j-impl:2.20.0")
    implementation("org.apache.logging.log4j:log4j-api:2.20.0")
    implementation("org.apache.logging.log4j:log4j-core:2.20.0")
    implementation("org.apache.commons:commons-collections4:4.5.0-M2")
    implementation("commons-io:commons-io:2.17.0")
    implementation("com.google.code.gson:gson:2.11.0")
    implementation("io.github.cdimascio:dotenv-java:3.0.0")
    // https://mvnrepository.com/artifact/org.postgresql/postgresql
    implementation 'org.postgresql:postgresql:42.7.4'
    // https://mvnrepository.com/artifact/org.hibernate/hibernate-core
    implementation 'org.hibernate:hibernate-core:5.4.28.Final'

    // https://mvnrepository.com/artifact/com.itextpdf/itextpdf
    implementation 'com.itextpdf:itextpdf:5.5.13.3'



    // https://mvnrepository.com/artifact/org.jfree/jfreechart
    implementation group: 'org.jfree', name: 'jfreechart', version: '1.5.5'

}

tasks.withType(JavaCompile) { // Всё плохо выводит
    options.encoding = 'UTF-8'
}

tasks.withType(Test) { // Только БД плохо выводит
    systemProperty 'file.encoding', 'UTF-8'
}

tasks.withType(Javadoc) { // Только БД плохо выводит
    options.encoding = 'UTF-8'
}


tasks.withType(JavaExec) {
    systemProperty 'file.encoding', 'UTF-8'
}


tasks.withType(Test) {
    jvmArgs '-Dfile.encoding=UTF-8'
}

test {
    useJUnitPlatform()
}